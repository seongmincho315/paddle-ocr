[project]
name = "paddle-ocr-server"
version = "0.0.1"
description = "PaddleX OCR(한국어 인식 모델 교체) pipeline을 paddlex --serve 로 감싼 서빙 앱"
requires-python = ">=3.9,<4.0"
dependencies = [
    "paddlepaddle-gpu==3.2.0",
    "paddlex==3.3.6",
    "paddlex[serving,ocr]",
    "uvicorn>=0.21,<0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
index-url = "https://pypi.org/simple"
extra-index-url = ["https://www.paddlepaddle.org.cn/packages/stable/cu126/"]
